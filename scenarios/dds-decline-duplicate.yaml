# Эталонный отказ ДДС: дубль. Памятка АРМ-112 называет три причины «Не принята» —
# не наша зона, не наша компетенция, дубль (docs/spec/DATASET.md). Здесь карточка
# повторяет уже принятый вызов: реагирование идёт, вторая бригада не нужна.
# Мотивированный отказ — без отметок; «Принята» вопреки эталону — D2.
