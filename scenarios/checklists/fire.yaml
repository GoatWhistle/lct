# Общий чек-лист по классификатору 01 — МЧС.
# Наследуется сценариями через `extends`, дополняется локально.
# Методика: docs/product/METHODOLOGY.md#чек-листы-опроса
#
# `examples` — другие формулировки того же вопроса. Чем их больше и чем они
# разнообразнее, тем точнее звонящий «понимает» оператора. Писать так, как
# говорят живые операторы, а не как в инструкции.
id: fire
dds: "01"
checklist:
  - id: q_address
    question: "Назовите адрес: улица, дом, квартира, этаж?"
    examples: ["Какой у вас адрес?", "Где вы находитесь?", "На каком этаже?", "Номер дома и квартиры?"]
  - id: q_what_burns
    question: "Что именно горит?"
    examples: ["Что горит?", "Что именно загорелось?", "Откуда идёт огонь?"]
  - id: q_people
    question: "Есть ли люди в помещении?"
    examples: ["Кто-то остался внутри?", "Все успели выйти?"]
  - id: q_smoke
    question: "Куда идёт дым, есть ли задымление подъезда?"
    examples: ["Куда идёт дым?", "Есть ли задымление в подъезде?", "Сильный дым?"]
  - id: q_gas
    question: "Есть ли газ, можно ли перекрыть?"
    examples: ["У вас газовая плита?", "Перекрыть газ сможете?"]
  - id: q_caller
    question: "Представьтесь и оставьте контактный телефон"
    examples: ["Как вас зовут?", "Ваш номер телефона?"]
