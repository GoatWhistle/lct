# Реплики оператора, которые НЕ являются вопросом чек-листа.
#
# Зачем: матчинг по эмбеддингам сравнивает реплику с формулировками вопросов.
# Без этого списка «Оставайтесь на линии» оказывается ближе к пункту чек-листа,
# чем половина настоящих вопросов, — и звонящий выдаёт адрес на «успокойтесь».
# Реплика засчитывается вопросом, только если она ближе к пункту, чем к любой
# фразе отсюда.
#
# Дополнять, когда в разборе видно, что звонящий «понял вопрос», которого не было.
not_questions:
  - "Служба 112, что случилось?"
  - "Успокойтесь, пожалуйста"
  - "Оставайтесь на линии"
  - "Помощь уже едет"
  - "Я вас понял"
  - "Говорите громче, плохо слышно"
  - "Выходите из квартиры"
  - "Не кладите трубку"
  - "Хорошо, записываю"
