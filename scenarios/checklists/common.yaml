# Реплики оператора, которые НЕ являются вопросом чек-листа.
#
# Зачем: матчинг по эмбеддингам сравнивает реплику с формулировками вопросов.
# Без этого списка «Оставайтесь на линии» оказывается ближе к пункту чек-листа,
# чем половина настоящих вопросов, — и звонящий выдаёт адрес на «успокойтесь».
# Реплика засчитывается вопросом, только если она ближе к пункту, чем к любой
# фразе отсюда.
#
# Дополнять, когда в разборе видно, что звонящий «понял вопрос», которого не было.
not_questions:
  - "Служба 112, что случилось?"
  - "Успокойтесь, пожалуйста"
  - "Оставайтесь на линии"
  - "Помощь уже едет"
  - "Я вас понял"
  - "Говорите громче, плохо слышно"
  - "Выходите из квартиры"
  - "Не кладите трубку"
  - "Хорошо, записываю"

# Пункты, которые не принадлежат ни одному классификатору. Сценарий подключает
# нужный, объявив пункт с тем же `id` и без текста, — формулировки подставятся
# отсюда. Насильно во все сценарии они не добавляются: неотработанный пункт
# штрафует курсанта отметкой E1 за вопрос, которого сценарий не требовал.
checklist:
  - id: q_address_check
    question: "Уточните: происшествие по этому адресу, вы сейчас там?"
    examples:
      - "Это точно Москва?"
      - "Вы сами находитесь по этому адресу?"
      - "Происшествие там же, где вы?"
      - "Какой город?"
      - "Это в черте города?"
      - "Уточните адрес происшествия"
      - "Вы смотрите на это или вам рассказали?"
      - "Адрес происшествия и ваш адрес совпадают?"
