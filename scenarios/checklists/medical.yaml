# Чек-лист по классификатору 03 — скорая помощь.
# Методика: docs/product/METHODOLOGY.md#чек-листы-опроса
#
# `examples` — как спрашивают живые операторы, а не как написано в инструкции.
# Чем их больше и чем они разнообразнее, тем точнее звонящий «понимает» вопрос.
id: medical
dds: "03"
checklist:
  - id: q_address
    question: "Назовите адрес: улица, дом, квартира, этаж, код домофона?"
    examples: ["Какой у вас адрес?", "Где вы находитесь?", "Куда ехать скорой?", "Код домофона какой?", "Номер квартиры?"]
  - id: q_what_happened
    question: "Что случилось с пострадавшим?"
    examples: ["Что с человеком?", "Что произошло?", "На что жалуется?", "Как это случилось?"]
  - id: q_who
    question: "Кто пострадавший: имя, возраст, пол?"
    examples: ["Сколько лет?", "Как зовут больного?", "Это мужчина или женщина?", "Возраст какой?"]
  - id: q_conscious
    question: "Человек в сознании, дышит?"
    examples: ["В сознании?", "Дышит?", "Он отвечает вам?", "Реагирует на голос?"]
  - id: q_can_move
    question: "Может ли пострадавший передвигаться самостоятельно?"
    examples: ["Он может идти?", "Ходит сам?", "Встать может?"]
  - id: q_caller
    question: "Представьтесь и оставьте контактный телефон"
    examples: ["Как вас зовут?", "Ваш номер телефона?", "Кем вы приходитесь пострадавшему?"]
