# Чек-лист по классификатору 02 — полиция.
# Методика: docs/product/METHODOLOGY.md#чек-листы-опроса
id: police
dds: "02"
checklist:
  - id: q_address
    question: "Назовите адрес или ориентир, где это происходит?"
    examples: ["Где это происходит?", "Какой адрес?", "Улица, дом?", "Куда наряду подъехать?"]
  - id: q_what_happened
    question: "Что именно происходит?"
    examples: ["Что случилось?", "Что произошло?", "Опишите, что вы видите"]
  - id: q_victims
    question: "Есть ли пострадавшие, нужна ли скорая?"
    examples: ["Пострадавшие есть?", "Скорая нужна?", "Кто-то ранен?", "Кровь есть?"]
  - id: q_suspects
    question: "Сколько нарушителей, как выглядят, есть ли оружие?"
    examples: ["Сколько их?", "Как они выглядят?", "Оружие есть?", "Во что одеты?", "Чем дерутся?"]
  - id: q_fled
    question: "Нарушители на месте или скрылись, в какую сторону?"
    examples: ["Они ещё там?", "Куда скрылись?", "В какую сторону уехали?", "Они на месте?"]
  - id: q_vehicle
    question: "Если есть транспорт: марка, цвет, номер?"
    examples: ["Какая машина?", "Номер запомнили?", "Цвет машины?", "Марка автомобиля?"]
  - id: q_caller
    question: "Представьтесь и оставьте контактный телефон"
    examples: ["Как вас зовут?", "Ваш номер телефона?", "Вы это сами видели?"]
