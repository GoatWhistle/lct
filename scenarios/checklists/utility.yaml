# Чек-лист по коммунальным авариям и городскому хозяйству.
# Методика: docs/product/METHODOLOGY.md#чек-листы-опроса
id: utility
dds: gkh
checklist:
  - id: q_address
    question: "Назовите адрес: улица, дом, подъезд?"
    examples: ["Какой адрес?", "Где это?", "Улица, дом?", "Какой подъезд?"]
  - id: q_what_happened
    question: "Что именно произошло?"
    examples: ["Что случилось?", "Что там с трубой?", "Опишите повреждение"]
  - id: q_scale
    question: "Каков масштаб: что затоплено, обесточено, перекрыто?"
    examples: ["Сколько залило?", "Насколько всё серьёзно?", "Что перекрыто?", "Подъезд затоплен?"]
  - id: q_threat
    question: "Есть ли угроза людям, пострадавшие?"
    examples: ["Люди пострадали?", "Есть угроза для жильцов?", "Кто-то пострадал?"]
  - id: q_caller
    question: "Представьтесь и оставьте контактный телефон"
    examples: ["Как вас зовут?", "Ваш номер телефона?"]
