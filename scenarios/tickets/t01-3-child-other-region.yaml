# Билет 1, вызов 3 (docs/spec/TICKETS.md). Вызов не из Москвы: Волжский —
# это Волгоградская область. Правильное действие — не заводить карточку,
# а передать вызов в систему-112 другого субъекта. Проверяется тем, что
# курсант вообще спросил про город.
id: t01-3-child-other-region
title: "Ребёнок упал с велосипеда, вызов из другого региона"
ticket: 1
position: 3
type: medical
level: L3
topics: [medical, address]
modes: [training, exam, self]

extends: checklists/medical.yaml
signs: [Травма]
outcome: transfer_region

persona:
  base: worried
  arc:
    - { stage: registration, mood: worried }
    - { stage: interview,    mood: worried }

first_line: "Здравствуйте, сын с велосипеда упал, рука и нога опухли!"

facts:
  # Мама называет улицу так, будто это Москва. Про область она скажет только
  # если спросить: ей не приходит в голову, что попала не туда.
  - id: f_address
    value: "улица Карла Маркса, около Молсыркомбината"
    refined: "Волгоградская область, город Волжский, улица Карла Маркса, около Волжского Молсыркомбината"
    reveal_on: { question: q_address }
    refine_on: q_address_check
  - id: f_what_happened
    value: "упал с велосипеда сам, отёк руки и ноги"
    reveal_on: { question: q_what_happened }
  - id: f_who
    value: "Смирнов Илья, 11 лет, сын"
    reveal_on: { question: q_who }
  - id: f_conscious
    value: "сведения о сознании ребёнка не указаны"
    reveal_on: { question: q_conscious }
  - id: f_caller
    value: "звонит мама, телефон 9163201283"
    reveal_on: { question: q_caller }

checklist:
  - { id: q_address,       fact: f_address }
  - { id: q_address_check }
  - { id: q_what_happened, fact: f_what_happened }
  - { id: q_who,           fact: f_who }
  - { id: q_conscious,     fact: f_conscious }
  - { id: q_caller,        fact: f_caller }

# Карточка здесь не заводится, поэтому обязательных полей нет: штрафовать
# за пустую карточку значит учить заполнять лишнее.
required_fields: []

ground_truth:
  address: "Волгоградская область, город Волжский, улица Карла Маркса, около Волжского Молсыркомбината"
