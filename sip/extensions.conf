[general]
static=yes
writeprotect=yes
clearglobalvars=no

[lct-training]
; 6001 — ДДС, 6002 — старший группы, 6003 — преподаватель.
exten => _600[1-3],1,NoOp(LCT training call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(RECORDING_FILE=${STRFTIME(${EPOCH},UTC,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${EXTEN}-${UNIQUEID})
 same => n,MixMonitor(/recordings/${RECORDING_FILE}.wav,b)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,StopMixMonitor()
 same => n,Hangup()

; 6101–6103 — браузерные WebRTC-абоненты: ДДС, старший группы, вышестоящий
; начальник. Тот же учебный контекст и запись, но отдельные endpoints не ломают
; обычные UDP/TCP-софтфоны 6001–6003.
exten => _610[1-3],1,NoOp(LCT WebRTC training call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(RECORDING_FILE=${STRFTIME(${EPOCH},UTC,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${EXTEN}-${UNIQUEID})
 same => n,MixMonitor(/recordings/${RECORDING_FILE}.wav,b)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,StopMixMonitor()
 same => n,Hangup()

; Эхо-номер нужен для проверки полного SIP/RTP-пути без второго устройства.
exten => 7000,1,NoOp(LCT SIP echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
